version: "2"

services:
  api:
    build: .
    container_name: api
    command: bash -c "cd /src/rest && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    links:
      - mongo
    volumes:
      - ${ADBREW_CODEBASE_PATH}/tmp:/tmp
      - ${ADBREW_CODEBASE_PATH}:/src
    dns:
      - 8.8.8.8
      - 1.1.1.1

  app:
    image: node:16
    container_name: app
    working_dir: /src/app
    command: bash -c "npm install --legacy-peer-deps && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ${ADBREW_CODEBASE_PATH}:/src
    environment:
      - CI=false
    dns:
      - 8.8.8.8
      - 1.1.1.1

  mongo:
    image: mongo:4.4
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ${ADBREW_CODEBASE_PATH}/db:/data/db
    command: ["mongod", "--bind_ip_all"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
